<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Products — Dova Futures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .catalog-bar {
      background: var(--sand); border-bottom: 1px solid var(--stone);
      padding: var(--space-4) var(--space-6); position: sticky; top: 56px; z-index: 90;
      display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
    }
    .filter-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .filter-chip {
      padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
      border: 1.5px solid var(--stone); background: #fff; cursor: pointer; transition: all .15s;
    }
    .filter-chip.active { background: var(--green-800); color: #fff; border-color: var(--green-800); }
    .search-input { padding: 8px 14px; border: 1.5px solid var(--stone); border-radius: var(--radius-sm); font-size: 14px; min-width: 200px; }
    .search-input:focus { outline: none; border-color: var(--green-800); }

    .window-banner {
      background: var(--green-800); color: var(--green-100);
      padding: 10px var(--space-6); text-align: center; font-size: 14px; font-weight: 500;
    }
    .window-banner.closed { background: var(--terracotta); }
    #banner-countdown { font-weight: 700; color: #fff; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-5);
      padding: var(--space-6);
      max-width: 1200px; margin: 0 auto;
    }
    .product-card { background:#fff; border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-card); cursor:pointer; transition:transform .15s, box-shadow .15s; }
    .product-card:hover { transform:translateY(-3px); box-shadow:0 8px 32px rgba(0,0,0,.12); }
    .product-img { height:200px; object-fit:cover; width:100%; background:var(--sand); }
    .product-img-placeholder { height:200px; background:linear-gradient(135deg,var(--green-100),var(--sand)); display:flex; align-items:center; justify-content:center; font-size:40px; }
    .product-info { padding:var(--space-4); }
    .product-cat { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--terracotta); margin-bottom:4px; }
    .product-name { font-weight:600; font-size:15px; margin-bottom:var(--space-2); line-height:1.3; }
    .product-price { font-family:var(--font-display); font-size:22px; color:var(--green-800); margin-bottom:var(--space-3); }
    .product-stock { font-size:12px; color:var(--ink-500); margin-bottom:var(--space-3); }
    .sold-out-badge { display:inline-block; padding:3px 10px; background:#FEE2E2; color:#991B1B; border-radius:99px; font-size:11px; font-weight:700; }

    .empty-state { grid-column:1/-1; text-align:center; padding:var(--space-9) 0; color:var(--ink-500); }
    .empty-state h3 { font-size:20px; margin-bottom:var(--space-3); }

    /* Product Modal */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:flex-end;
    }
    .modal-overlay.open { display:flex; }
    @media (min-width:640px) { .modal-overlay { align-items:center; justify-content:center; } }
    .modal {
      background:#fff; border-radius:var(--radius-lg) var(--radius-lg) 0 0; width:100%;
      max-height:90vh; overflow-y:auto; padding:var(--space-6);
      max-width:600px; border-radius:var(--radius-lg);
    }
    .modal-img { width:100%; height:280px; object-fit:cover; border-radius:var(--radius-md); margin-bottom:var(--space-5); background:var(--sand); }
    .modal-close { float:right; background:none; border:none; font-size:24px; cursor:pointer; color:var(--ink-500); line-height:1; }
    .qty-stepper { display:flex; align-items:center; gap:var(--space-3); margin:var(--space-4) 0; }
    .qty-btn { width:36px; height:36px; border-radius:var(--radius-sm); border:1.5px solid var(--stone); background:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .qty-val { font-size:18px; font-weight:700; min-width:32px; text-align:center; }

    /* Cart badge */
    #cart-badge {
      position:fixed; bottom:24px; right:24px; background:var(--terracotta); color:#fff;
      width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:22px; box-shadow:0 4px 16px rgba(0,0,0,.2); cursor:pointer; z-index:150;
      text-decoration:none; transition:transform .15s;
    }
    #cart-badge:hover { transform:scale(1.08); }
    #cart-count {
      position:absolute; top:-4px; right:-4px; background:var(--green-800); color:#fff;
      width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="logo">DOVA FUTURES <span>Preorder Platform</span></a>
    <ul class="nav-links">
      <li><a href="/catalog" class="active">Browse Goods</a></li>
      <li><a href="/cart">Cart</a></li>
      <li><a href="/track">Track Order</a></li>
    </ul>
  </nav>

  <div id="window-banner" class="window-banner">
    Loading preorder window status...
  </div>

  <div class="catalog-bar">
    <div class="filter-chips" id="filter-chips">
      <button class="filter-chip active" data-cat="">All</button>
    </div>
    <input type="search" class="search-input" id="search-input" placeholder="Search products...">
  </div>

  <div class="products-grid" id="products-grid">
    <div class="empty-state"><h3>Loading products...</h3></div>
  </div>

  <!-- Product modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Cart badge -->
  <a href="/cart" id="cart-badge">
    🛒 <span id="cart-count">0</span>
  </a>

  <div id="toast"></div>

  <script src="/js/cart.js"></script>
  <script src="/js/catalog.js"></script>
</body>
</html>
