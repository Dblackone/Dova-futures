<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail — Dova Futures Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .detail-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-6); }
    @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
    .info-section { background: #fff; border-radius: var(--radius-md); padding: var(--space-6); box-shadow: var(--shadow-card); margin-bottom: var(--space-5); }
    .info-section h3 { font-size: 16px; font-weight: 700; margin-bottom: var(--space-4); border-bottom: 1px solid var(--sand); padding-bottom: var(--space-3); }
    .info-row { display: flex; gap: var(--space-4); margin-bottom: var(--space-3); font-size: 14px; }
    .info-label { color: var(--ink-500); width: 140px; flex-shrink: 0; }
    .info-val { font-weight: 500; }
    .action-btn { width: 100%; margin-bottom: var(--space-3); text-align: left; }
    .wa-link { display: inline-flex; align-items: center; gap: 6px; color: #25D366; font-weight: 700; text-decoration: none; font-size: 14px; }
    .stage-input { display: flex; gap: var(--space-3); align-items: flex-end; }
    .stage-input input { flex: 1; }
    textarea { resize: vertical; min-height: 80px; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin" class="logo">DOVA FUTURES <span>Preorder Admin</span></a>
      <a href="/admin" class="sidebar-link">📊 Dashboard</a>
      <a href="/admin/products" class="sidebar-link">📦 Products</a>
      <a href="/admin/orders" class="sidebar-link active">🧾 Orders</a>
      <a href="/admin/calendar" class="sidebar-link">📅 Calendar</a>
      <a href="/" class="sidebar-link">🌐 View Site</a>
      <a href="#" class="sidebar-link" onclick="logout()">🚪 Log Out</a>
    </aside>
    <main class="admin-main">
      <nav class="mobile-admin-nav">
        <a href="/admin">📊 Dashboard</a>
        <a href="/admin/products">📦 Products</a>
        <a href="/admin/orders" class="active">🧾 Orders</a>
        <a href="/admin/calendar">📅 Calendar</a>
        <a href="/">🌐 Site</a>
      </nav>
      <div class="admin-header">
        <div>
          <a href="/admin/orders" style="color:var(--ink-500);font-size:14px;text-decoration:none">← Back to Orders</a>
          <h1 id="page-title" style="margin-top:4px">Order —</h1>
        </div>
        <div id="status-badge" class="badge badge-grey"></div>
      </div>

      <div class="detail-grid">
        <div>
          <!-- Buyer Info -->
          <div class="info-section" id="buyer-info"></div>
          <!-- Items -->
          <div class="info-section" id="items-section"></div>
          <!-- Payment history -->
          <div class="info-section" id="payment-history"></div>
        </div>
        <div>
          <!-- Status control -->
          <div class="info-section">
            <h3>Update Status</h3>
            <div class="form-group" style="margin-bottom:var(--space-3)">
              <select id="status-select">
                <option value="goods_paid">Goods Paid</option>
                <option value="window_closed">Window Closed</option>
                <option value="sourcing">Sourcing</option>
                <option value="shipped_china">Shipped from China</option>
                <option value="customs_nigeria">At Customs Nigeria</option>
                <option value="arrived_akure">Arrived Akure</option>
                <option value="stage2_paid">Stage 2 Paid</option>
                <option value="waybilled">Waybilled</option>
                <option value="delivered">Delivered</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:var(--space-4)">
              <label>Notes (optional)</label>
              <textarea id="notes-input" placeholder="Add tracking notes..."></textarea>
            </div>
            <button class="btn btn-primary action-btn" onclick="updateStatus()">Update Status</button>
            <div id="status-wa-link" style="display:none;margin-top:var(--space-3)"></div>
          </div>

          <!-- Stage 2 Invoice -->
          <div class="info-section">
            <h3>Stage 2 — Shipping Fee Invoice</h3>
            <div class="stage-input">
              <div class="form-group" style="flex:1"><label>Amount (₦)</label><input type="number" id="s2-amount" placeholder="5000.00" step="0.01"></div>
              <button class="btn btn-primary btn-sm" onclick="sendStage2()">Send Invoice</button>
            </div>
            <div id="s2-wa-link" style="display:none;margin-top:var(--space-3)"></div>
          </div>

          <!-- Stage 3 Invoice -->
          <div class="info-section">
            <h3>Stage 3 — Waybill Fee</h3>
            <div class="form-group" style="margin-bottom:var(--space-3)">
              <label>Amount (₦)</label>
              <input type="number" id="s3-amount" placeholder="2000.00" step="0.01">
            </div>
            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-3)">
              <div class="form-group"><label>Delivery Agent</label><input type="text" id="s3-agent" placeholder="GIG Logistics"></div>
              <div class="form-group"><label>Waybill No.</label><input type="text" id="s3-waybill" placeholder="GIG123456"></div>
            </div>
            <button class="btn btn-primary action-btn" onclick="sendStage3()">Set Waybill Details</button>
          </div>

          <!-- Forfeiture -->
          <div class="info-section">
            <h3>Forfeiture</h3>
            <div class="form-group" style="margin-bottom:var(--space-3)">
              <label>Reason</label>
              <input type="text" id="forfeit-reason" placeholder="Non-payment of shipping fee" value="Non-payment of shipping fee">
            </div>
            <button class="btn btn-danger action-btn" onclick="forfeitOrder()">Mark as Forfeited</button>
            <div id="forfeit-wa-link" style="display:none;margin-top:var(--space-3)"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <script src="/js/admin/order-detail.js"></script>
</body>
</html>
