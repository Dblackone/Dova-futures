name: Deploy Hub to GitHub Pages

on:
  # Safety gate: the functional Hub is owner-only on OpenAI Sites. Keep this
  # curated public fallback manual unless the principal approves publication.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the read-only Hub. Never expose the private repository
          # tree or client/project records as part of the Pages artifact.
          path: hub

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
